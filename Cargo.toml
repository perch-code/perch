[workspace]
resolver = "2"
members = [
    "crates/perch-agent",
    "crates/perch-knowledge",
    "crates/perch-github",
    "crates/perch-git",
    "crates/perch-lsp",
    "crates/perch-syntax",
    "crates/perch-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jiff = { version = "0.2", features = ["serde"] }
directories = "6"
toml = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

# The fork's `perch` branch is upstream main with the patches Perch waits on
# cherry-picked onto it: a fix for a floem panic ("all view ids are created
# with a root") when a view is removed in the same update batch as its
# listener registration, and one for the headless window panicking when a
# focused view asks for an IME (https://github.com/lapce/floem/pull/1088).
# Drop a patch from the branch once upstream merges it; `cargo update -p floem`
# takes the branch's new head.
[patch."https://github.com/lapce/floem"]
floem = { git = "https://github.com/criccomini/floem", branch = "perch" }
