[workspace]
resolver = "2"
members = [
    "crates/perch-agent",
    "crates/perch-knowledge",
    "crates/perch-github",
    "crates/perch-git",
    "crates/perch-lsp",
    "crates/perch-syntax",
    "crates/perch-app",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
jiff = { version = "0.2", features = ["serde"] }
directories = "6"
toml = "0.9"

# macOS's default `split-debuginfo = "unpacked"` leaves debug info in each
# codegen unit's `.o` in target/debug/deps, and cargo never deletes the ones
# a rebuild supersedes: about 0.65 GB per perch-app rebuild, so a busy target
# reached 96 GB. Packed debug info goes into a .dSYM beside each binary and
# the objects are dropped. It costs ~6 s of dsymutil per link; line tables
# keep that small and still give panic backtraces their file:line.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"

# Dependencies (floem, vger, swash, taffy) do the layout, shaping and
# rasterizing, and unoptimized they made a debug Perch crawl. Optimize them
# and leave the workspace crates at opt-level 0, so a rebuild stays quick.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

# A release build to run on your own machine: `cargo run --profile local`.
# Thin LTO optimizes perch again with every dependency on each build, and
# took 313 of the 503 seconds that a release build of the perch crate
# took. This profile also uses more codegen units and builds incrementally.
[profile.local]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# The fork's `perch` branch is upstream main with the patches Perch waits on
# cherry-picked onto it: a fix for a floem panic ("all view ids are created
# with a root") when a view is removed in the same update batch as its
# listener registration, one for the headless window panicking when a
# focused view asks for an IME (https://github.com/lapce/floem/pull/1088),
# one for a view behind two boxes painting twice a frame and never
# getting its `post_paint` (https://github.com/lapce/floem/pull/1089), one
# that sets a variable font's `opsz` axis to the text's size, as CSS's
# `font-optical-sizing: auto` does, without which San Francisco draws small
# text from its display cut, tighter than any native view or browser, one
# that keeps the word a double click selects, which the pointer move
# macOS sends before the release used to cut off at the pointer (a drag
# after a double or triple click now grows the selection by words or lines),
# one that keys vger's glyph atlas on the face and the variation
# coordinates as well as the file, without which Regular and Bold from one
# .ttc share a bitmap, one that keeps the focus in a text box through
# Alt with an arrow, which moves the cursor by a word there and would
# otherwise also walk the focus off to a neighbour, one that moves
# floem from taffy 0.9 to 0.13, whose grid no longer runs `auto` tracks
# past their container (https://github.com/DioxusLabs/taffy/pull/1001):
# a markdown table at its own width drew its last column over its border
# and its last row under it, one that wraps a label's or rich text's lines
# at the view's width when a word is wider than the view, where every line
# broke at the word's width and ran past the edge and the view was as tall
# as its text broken after every word, one that nests clips
# under vger, and one that sets every glyph of a line on its baseline,
# rounded to a whole pixel, under vger too. vger has one scissor, which
# each clip replaced and each clear lifted, so once a clipped view in a
# scroll had painted, the rest of the scroll painted past its viewport:
# the Cmd-P palette drew its rows' letters and dots over its query box and
# past its border. And vger drew glyphs up to two pixels above their
# baseline, and a letter first drawn above the window's top a pixel lower
# than one first drawn on the screen, so the letters of one word stood at
# two heights. Then one that makes a scroll's `ShowBarsWhenIdle` do what
# its docs say: set false, it had hidden the bars for good, and now they
# show as the user scrolls and fade out once scrolling stops, as macOS's
# overlay scroll bars do. Then one that times a press and its release on
# one clock: floem stamped each from a clock of its own, started at its
# first use in the process, and counts a press and a release on different
# views as a click only within 100ms, so the first click in a process
# always passed and a long first press widened the window for every click
# after it. Then one that sends a pointer move's PointerLeave events
# before its PointerEnter events, and neither to a view the pointer stays
# on. floem routed them newest first, so a move from one row to the next
# entered the new row before it left the old one; and a hover path holds
# only the ancestors whose own box holds the pointer, so crossing the edge
# of a box a view hangs out of left and re-entered every view inside it,
# the Leave last. A draft's Delete in the Submit review form hid under the
# pointer that way. Then one that sends FocusLost before FocusGained:
# floem sent them the other way round, so a view that turns something on
# when focus arrives and off when it leaves ended off (the two search
# boxes share `search_focused`, and a text box's IME input), and a view
# refocused by Tab ended on FocusLost. Then one that sends a drag no
# DragTargetLeave and DragTargetEnter for a target that stays under the
# pointer as it crosses the edge of a view the target hangs out of. Then
# one that scrolls the editor's caret into view only when the caret moves.
# Working out where the caret is drawn read the editor's style tracked,
# and every restyle writes the style, so a hover or a resize pulled code
# the reader had scrolled past the caret back up to it. Then one that
# runs a timer whose view was removed before it fired: floem looked up
# that view's root when the timer fired and panicked ("all view ids are
# entered into the root map") when there was none, so a scroll closed
# within a second of being scrolled took the app down with its bars'
# fade timer. Then one that makes vger's faux bold (0.1px on macOS)
# thicken every glyph. swash worked out which way is outward from all of
# a glyph's points strung together, so where a small contour led the
# outline it pushed the glyph inward: SF Mono's `i`, whose dot comes
# first, drew a stem two thirds as wide as its `l`, with slabs smeared
# over two grey rows, and so did 91 more of its glyphs (ì, í, ½) and
# about 50 of SF Pro's (Ě, Ž). vger now bolds the outline itself, the
# direction taken contour by contour as FreeType does. Then one that
# reports a Control click on macOS as a secondary click. winit reports
# the left button with Control held, and floem opens a context menu for
# the secondary button alone, so a Control click opened no menu on a
# symbol, an item or a notification, and did whatever a click does. Then
# one that keeps the editor from taking a right press for a left one: it
# asked `is_primary_pointer`, which is true of every mouse button, so a
# right-click started a drag selection whose release the context menu
# swallowed, and the selection followed the pointer after the menu
# closed. It also collapsed the selection a right-click landed in. Then
# one that keeps a text's measured sizes until its text changes: taffy
# measures a text several times a pass, and each measure of an
# ellipsised label shaped the "..." and the cut text from scratch, so a
# relayout of the sidebar's rows spent most of its time in the shaper,
# the more with San Francisco's variation deltas. Then one that centres
# a label on its capitals: it centred the span from the ascent to the
# baseline, and San Francisco's ascent reaches 0.26em above its caps, so
# every label drew about 0.13em low in its box, beside the avatar in a
# comment's byline and the glyph in a pill. Then one that zooms a macOS
# window from the main queue once the event handler has returned.
# `-[NSWindow zoom:]` does not return until its animation ends, and
# called from inside the handler it held back every resize and redraw of
# the animation, so a double click on the title bar stretched the last
# frame to the new size and relaid out only at the end. Then one that
# centres an emoji on its bitmap, at the nearest whole pixel. Apple Color
# Emoji gives its cap height as a whole em while swash draws its bitmaps
# 0.125em below the baseline, and a bitmap ignores the subpixel bin that
# takes up the half pixel a label measures wider than its text, so each
# emoji in the reaction picker drew 3px low and 1px left. Then one that
# holds a window's paint, for 100ms at most, while an update its 4ms
# budget cut short leaves deferred messages queued. A scroll's
# `scroll_to` waits in those for layout, so a pane built with its scroll
# put back, as a file's tab or Conversation is on every switch, painted
# a frame at its top before jumping to where the reader had left it.
# Then one that pastes text ending in a newline at the cursor in a
# non-modal editor. floem pasted it as whole lines, vim's way, above the
# cursor's line, so a line copied from another app and pasted after a
# comment's "> " landed above the quote. Only a line the editor itself
# copied or cut with nothing selected still goes back above, as in VS
# Code. Then one that lets an `AttrsList` carry parley's inline boxes,
# room in a line that the caller draws into, and says where each landed:
# a comment's `$…$` is a typeset formula in its line of text, wrapping
# with the words. Then one that draws the caret at a line's start inside
# the editor. The caret is a 2px bar centred on its x, so at column 0 it
# began at x = -1, half outside the editor's clip, and vger rounded the
# half left inside away: a box opened on a quote, its caret on the empty
# line under it, showed no caret until something was typed. Then one
# that lets a rich text view keep to one line, cut short with an
# ellipsis as a label is, where it always wrapped: an event's line on
# Conversation is one text, so a drag selects across its name, sha and
# subject, and a long subject still ends in "...". Then one that makes
# no click from a mouse's back and forward buttons, as a browser makes
# none. floem clicked for every button but the right one, so Back
# pressed over a sidebar row or a button went back and pressed it too.
# Then one that paints a view's `opacity`, which floem defined and
# never read, so a disabled icon button drew at full strength. A faded
# view paints itself and its children into a layer of that alpha. vger
# has no layers, so it multiplies the alpha into every paint instead,
# and draws a faded image or full-colour SVG through its glyph path,
# the one that takes a paint. Children that overlap inside a faded view
# show through each other there. Then one that paints a window when
# the system asks it to redraw. floem painted only when it had asked
# for a paint itself, and an X11 window with no compositor keeps no
# copy of its pixels, so on Linux a window that another had covered
# showed what had been on the screen there until something in it
# changed. Last, one that adds zoom-in and zoom-out cursors, which
# winit draws and floem's `CursorStyle` had no names for; a shrunk
# walkthrough diagram shows the zoom-in one.
# Drop a patch from the branch once upstream merges it; `cargo update -p floem`
# takes the branch's new head. `floem_renderer` is patched too so that
# perch-app's own dependency on it resolves to the checkout floem's does,
# and there is one `usvg::Tree` for a picture to be parsed into and drawn.
[patch."https://github.com/lapce/floem"]
floem = { git = "https://github.com/criccomini/floem", branch = "perch" }
floem_renderer = { git = "https://github.com/criccomini/floem", branch = "perch" }
