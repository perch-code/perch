# Push a tag named for Cargo.toml's version (v0.2.0) to build Perch.app on an
# Apple Silicon runner, for it and cross-compiled for Intel, and Perch for
# Linux on x86_64 and arm64 runners, and publish them all as a GitHub
# release. A tag with a hyphen (v0.2.0-beta.1) becomes a prerelease, which
# `releases/latest` skips.
#
# Install or update from the latest release (Perch-macos-x86_64.tar.gz on Intel):
#   gh release download --repo perch-code/perch --pattern Perch-macos-arm64.tar.gz -O - | tar -xz -C /Applications
# On Linux (Perch-linux-arm64.tar.gz on arm64):
#   gh release download --repo perch-code/perch --pattern Perch-linux-x86_64.tar.gz -O - | tar -xz -C ~/.local/share

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches Cargo.toml
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "perch-app"))')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml's version $version"
            exit 1
          fi

  macos:
    needs: check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2

      - name: Build Perch.app for Apple Silicon
        run: ./scripts/bundle.sh

      # COPYFILE_DISABLE keeps macOS tar from adding ._ AppleDouble files.
      - name: Package for Apple Silicon
        run: COPYFILE_DISABLE=1 tar -czf Perch-macos-arm64.tar.gz -C target Perch.app

      - name: Build Perch.app for Intel
        run: |
          rustup target add x86_64-apple-darwin
          ./scripts/bundle.sh x86_64-apple-darwin

      - name: Package for Intel
        run: COPYFILE_DISABLE=1 tar -czf Perch-macos-x86_64.tar.gz -C target Perch.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Perch-macos-*.tar.gz

  # 22.04 rather than the latest, so the binary needs glibc 2.35, not
  # 24.04's 2.39, and runs on older distributions too.
  linux:
    needs: check
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      # muda's menus link GTK 3 and fontique links fontconfig, as in CI.
      - name: Install GTK and fontconfig headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libfontconfig1-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build Perch
        run: ./scripts/bundle.sh

      - name: Package
        run: tar -czf Perch-linux-${{ matrix.arch }}.tar.gz -C target perch

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: Perch-linux-*.tar.gz

  publish:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" Perch-macos-*.tar.gz Perch-linux-*.tar.gz \
            --verify-tag --generate-notes "${prerelease[@]}"
