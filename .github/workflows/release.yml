# Push a tag named for Cargo.toml's version (v0.2.0) to build perchd for
# Linux and macOS, on x86_64 and arm64, then Perch.app on an Apple Silicon
# runner, for it and cross-compiled for Intel, and Perch for Linux on x86_64
# and arm64 runners, each carrying all four engines, and publish them all
# as a GitHub release. A tag with a hyphen (v0.2.0-beta.1) becomes a
# prerelease, which `releases/latest` skips.
#
# install.sh downloads the latest release's tarball for its platform, so
# keep the Perch-<os>-<arch>.tar.gz names in step with it. Every app carries
# all four engines in its own binary: its build (crates/perch-app/build.rs)
# takes perchd-<linux|macos>-<arch>.tar.gz from PERCH_ENGINES by those names,
# so keep those too. They are published beside the apps as well, for running
# one by hand.

name: Release

# Run by hand (Actions > Release > Run workflow, or `gh workflow run
# release.yml`), it builds everything a release does and publishes nothing:
# a rehearsal, for a change to this file or to how the app takes its
# engines, which no other workflow runs.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # A rehearsal has no tag to match.
      - name: Check the tag matches Cargo.toml
        if: github.event_name == 'push'
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "perch-app"))')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml's version $version"
            exit 1
          fi

  # The engine alone, for a Mac that is a host. Signed with Developer ID when
  # the repository has a certificate configured, or ad hoc otherwise: Apple
  # Silicon runs nothing unsigned.
  perchd-macos:
    needs: check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2

      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_P12" ] && [ -z "$APPLE_CERTIFICATE_PASSWORD" ] && [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "No Apple signing secrets configured; falling back to ad-hoc signing."
            exit 0
          fi
          if [ -z "$APPLE_CERTIFICATE_P12" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "::error::Both APPLE_CERTIFICATE_P12 and APPLE_CERTIFICATE_PASSWORD must be set to sign with Developer ID"
            exit 1
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/perch-signing.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          CERT_RAW="$RUNNER_TEMP/perch-signing-raw.p12"
          CERT_PEM="$RUNNER_TEMP/perch-signing.pem"
          CERT_PATH="$RUNNER_TEMP/perch-signing.p12"
          APPLE_CERTIFICATE_PASSWORD="${APPLE_CERTIFICATE_PASSWORD%$'\r'}"
          APPLE_CERTIFICATE_PASSWORD="${APPLE_CERTIFICATE_PASSWORD%$'\n'}"
          export APPLE_CERTIFICATE_PASSWORD
          python3 -c 'import base64,os,sys; sys.stdout.buffer.write(base64.b64decode("".join(os.environ["APPLE_CERTIFICATE_P12"].split())))' > "$CERT_RAW"

          # Repackage into legacy 3DES/SHA-1 PKCS#12: modern OpenSSL 3 and
          # macOS LibreSSL export AES-256/SHA-256 PBES2 by default, which
          # macOS's `security import` rejects with "passphrase is not correct".
          OPENSSL_BIN=""
          for candidate in /opt/homebrew/opt/openssl@3/bin/openssl /opt/homebrew/opt/openssl/bin/openssl "$(command -v openssl)"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              OPENSSL_BIN="$candidate"
              break
            fi
          done
          LEGACY_FLAG=()
          if "$OPENSSL_BIN" version | grep -qi '^OpenSSL 3'; then
            LEGACY_FLAG=(-legacy)
          fi
          "$OPENSSL_BIN" pkcs12 "${LEGACY_FLAG[@]}" \
            -in "$CERT_RAW" \
            -passin env:APPLE_CERTIFICATE_PASSWORD \
            -nodes \
            -out "$CERT_PEM"
          "$OPENSSL_BIN" pkcs12 -export "${LEGACY_FLAG[@]}" \
            -certpbe PBE-SHA1-3DES \
            -keypbe PBE-SHA1-3DES \
            -macalg sha1 \
            -in "$CERT_PEM" \
            -passout env:APPLE_CERTIFICATE_PASSWORD \
            -out "$CERT_PATH"
          rm -f "$CERT_RAW" "$CERT_PEM"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          EXISTING_KEYCHAINS=()
          while IFS= read -r kc; do
            [ -n "$kc" ] && EXISTING_KEYCHAINS+=("$kc")
          done < <(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"[[:space:]]*$//')
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${EXISTING_KEYCHAINS[@]}"
          rm -f "$CERT_PATH"

          IDENTITY="$APPLE_SIGNING_IDENTITY"
          if [ -z "$IDENTITY" ]; then
            IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/"Developer ID Application:/ { print $2; exit }')"
          fi
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found; set APPLE_SIGNING_IDENTITY or check APPLE_CERTIFICATE_P12"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build and package perchd
        run: |
          rustup target add x86_64-apple-darwin
          IDENTITY="${APPLE_SIGNING_IDENTITY:--}"
          for pair in aarch64-apple-darwin:arm64 x86_64-apple-darwin:x86_64; do
            triple="${pair%%:*}" arch="${pair##*:}"
            cargo build --release --locked -p perchd --target "$triple"
            bin="target/$triple/release/perchd"
            if [ "$IDENTITY" = "-" ]; then
              codesign --force --sign - "$bin"
            else
              codesign --force --options runtime --timestamp --identifier com.perch.perchd --sign "$IDENTITY" "$bin"
            fi
            codesign --verify --strict "$bin"
            lipo -archs "$bin"
            COPYFILE_DISABLE=1 tar -czf "perchd-macos-$arch.tar.gz" -C "target/$triple/release" perchd
          done
          target/aarch64-apple-darwin/release/perchd --version

      - name: Clean up signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/perch-signing.keychain-db" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: perchd-macos
          path: perchd-macos-*.tar.gz

  # The engine alone, for a host: no GTK, no window. Built against musl
  # and linked statically, so it runs on any Linux of its architecture,
  # whatever its libc. ring and the bundled SQLite are C, compiled with
  # musl-gcc.
  perchd-linux:
    needs: check
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2

      - name: Build perchd
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          target="$(uname -m)-unknown-linux-musl"
          rustup target add "$target"
          export CC_x86_64_unknown_linux_musl=musl-gcc CC_aarch64_unknown_linux_musl=musl-gcc
          cargo build --release --locked -p perchd --target "$target"
          echo "PERCHD_DIR=target/$target/release" >> "$GITHUB_ENV"

      # No interpreter and no shared libraries, or the build is wrong. `file`
      # and ldd word a static binary differently from one version to the
      # next, and a static PIE differently again, so ask readelf.
      - name: Check perchd is static
        run: |
          bin="$PERCHD_DIR/perchd"
          file "$bin"
          if readelf -lW "$bin" | grep -q INTERP || readelf -dW "$bin" | grep -q NEEDED; then
            readelf -dW "$bin" | grep NEEDED || true
            echo "::error::perchd is dynamically linked"
            exit 1
          fi
          "$bin" --version

      - name: Package perchd
        run: tar -czf perchd-linux-${{ matrix.arch }}.tar.gz -C "$PERCHD_DIR" perchd

      - uses: actions/upload-artifact@v4
        with:
          name: perchd-linux-${{ matrix.arch }}
          path: perchd-linux-*.tar.gz

  # The apps, once every engine is built: each carries all four, so it can
  # start its own on whatever host it is pointed at. The app's build takes
  # them from PERCH_ENGINES, where one runner could not build them all,
  # and fails if one is missing.
  macos:
    needs: [perchd-macos, perchd-linux]
    runs-on: macos-15
    env:
      PERCH_ENGINES: ${{ github.workspace }}/engines
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: perchd-*
          path: engines
          merge-multiple: true

      - uses: Swatinem/rust-cache@v2

      - name: Import Apple signing and notarization credentials
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_P12" ] && [ -z "$APPLE_CERTIFICATE_PASSWORD" ] && [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            if [ -n "$APPLE_API_KEY_P8" ] || [ -n "$APPLE_API_KEY_ID" ] || [ -n "$APPLE_API_ISSUER_ID" ]; then
              echo "::error::Notarization secrets are set, but APPLE_CERTIFICATE_P12 / APPLE_CERTIFICATE_PASSWORD are missing"
              exit 1
            fi
            echo "No Apple signing secrets configured; falling back to ad-hoc signing."
            exit 0
          fi
          if [ -z "$APPLE_CERTIFICATE_P12" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "::error::Both APPLE_CERTIFICATE_P12 and APPLE_CERTIFICATE_PASSWORD must be set to sign with Developer ID"
            exit 1
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/perch-signing.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          CERT_RAW="$RUNNER_TEMP/perch-signing-raw.p12"
          CERT_PEM="$RUNNER_TEMP/perch-signing.pem"
          CERT_PATH="$RUNNER_TEMP/perch-signing.p12"
          APPLE_CERTIFICATE_PASSWORD="${APPLE_CERTIFICATE_PASSWORD%$'\r'}"
          APPLE_CERTIFICATE_PASSWORD="${APPLE_CERTIFICATE_PASSWORD%$'\n'}"
          export APPLE_CERTIFICATE_PASSWORD
          python3 -c 'import base64,os,sys; sys.stdout.buffer.write(base64.b64decode("".join(os.environ["APPLE_CERTIFICATE_P12"].split())))' > "$CERT_RAW"

          # Repackage into legacy 3DES/SHA-1 PKCS#12: modern OpenSSL 3 and
          # macOS LibreSSL export AES-256/SHA-256 PBES2 by default, which
          # macOS's `security import` rejects with "passphrase is not correct".
          OPENSSL_BIN=""
          for candidate in /opt/homebrew/opt/openssl@3/bin/openssl /opt/homebrew/opt/openssl/bin/openssl "$(command -v openssl)"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              OPENSSL_BIN="$candidate"
              break
            fi
          done
          LEGACY_FLAG=()
          if "$OPENSSL_BIN" version | grep -qi '^OpenSSL 3'; then
            LEGACY_FLAG=(-legacy)
          fi
          "$OPENSSL_BIN" pkcs12 "${LEGACY_FLAG[@]}" \
            -in "$CERT_RAW" \
            -passin env:APPLE_CERTIFICATE_PASSWORD \
            -nodes \
            -out "$CERT_PEM"
          "$OPENSSL_BIN" pkcs12 -export "${LEGACY_FLAG[@]}" \
            -certpbe PBE-SHA1-3DES \
            -keypbe PBE-SHA1-3DES \
            -macalg sha1 \
            -in "$CERT_PEM" \
            -passout env:APPLE_CERTIFICATE_PASSWORD \
            -out "$CERT_PATH"
          rm -f "$CERT_RAW" "$CERT_PEM"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          EXISTING_KEYCHAINS=()
          while IFS= read -r kc; do
            [ -n "$kc" ] && EXISTING_KEYCHAINS+=("$kc")
          done < <(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"[[:space:]]*$//')
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${EXISTING_KEYCHAINS[@]}"
          rm -f "$CERT_PATH"

          IDENTITY="$APPLE_SIGNING_IDENTITY"
          if [ -z "$IDENTITY" ]; then
            IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/"Developer ID Application:/ { print $2; exit }')"
          fi
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found; set APPLE_SIGNING_IDENTITY or check APPLE_CERTIFICATE_P12"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

          if [ -n "$APPLE_API_KEY_P8" ] || [ -n "$APPLE_API_KEY_ID" ] || [ -n "$APPLE_API_ISSUER_ID" ]; then
            if [ -z "$APPLE_API_KEY_P8" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER_ID" ]; then
              echo "::error::APPLE_API_KEY_P8, APPLE_API_KEY_ID, and APPLE_API_ISSUER_ID must all be set to notarize"
              exit 1
            fi
            KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            if grep -q "BEGIN PRIVATE KEY" <<<"$APPLE_API_KEY_P8"; then
              printf '%s\n' "$APPLE_API_KEY_P8" > "$KEY_PATH"
            else
              base64 --decode <<<"$APPLE_API_KEY_P8" > "$KEY_PATH"
            fi
            chmod 600 "$KEY_PATH"
            {
              echo "APPLE_NOTARY_KEY=$KEY_PATH"
              echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
              echo "APPLE_API_ISSUER_ID=$APPLE_API_ISSUER_ID"
            } >> "$GITHUB_ENV"
          fi

      - name: Build Perch.app for Apple Silicon
        run: ./scripts/bundle.sh

      # COPYFILE_DISABLE keeps macOS tar from adding ._ AppleDouble files.
      - name: Package for Apple Silicon
        run: COPYFILE_DISABLE=1 tar -czf Perch-macos-arm64.tar.gz -C target Perch.app

      - name: Build Perch.app for Intel
        run: |
          rustup target add x86_64-apple-darwin
          ./scripts/bundle.sh x86_64-apple-darwin

      - name: Package for Intel
        run: COPYFILE_DISABLE=1 tar -czf Perch-macos-x86_64.tar.gz -C target Perch.app

      - name: Clean up signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/perch-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Perch-macos-*.tar.gz

  # 22.04 rather than the latest, so the binary needs glibc 2.35, not
  # 24.04's 2.39, and runs on older distributions too.
  linux:
    needs: [perchd-macos, perchd-linux]
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      PERCH_ENGINES: ${{ github.workspace }}/engines
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: perchd-*
          path: engines
          merge-multiple: true

      # muda's menus link GTK 3 and fontique links fontconfig, as in CI.
      - name: Install GTK and fontconfig headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libfontconfig1-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build Perch
        run: ./scripts/bundle.sh

      - name: Package
        run: tar -czf Perch-linux-${{ matrix.arch }}.tar.gz -C target perch

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: Perch-linux-*.tar.gz

  # Only for a tag: a rehearsal stops with the apps built.
  publish:
    if: github.event_name == 'push'
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          sha256sum Perch-macos-*.tar.gz Perch-linux-*.tar.gz perchd-linux-*.tar.gz \
            perchd-macos-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" Perch-macos-*.tar.gz Perch-linux-*.tar.gz \
            perchd-linux-*.tar.gz perchd-macos-*.tar.gz SHA256SUMS \
            --verify-tag --generate-notes "${prerelease[@]}"
