name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # rustup installs the toolchain rust-toolchain.toml pins, rustfmt included.
      - name: Check formatting
        run: cargo fmt --all --check

  # Perch is built and run on a Mac, so this keeps its Linux paths compiling
  # and their tests passing.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # muda's menus link GTK 3 and fontique links fontconfig; wayland and
      # xkbcommon are loaded at runtime and need no headers. musl-gcc is
      # for the perchd the app's build puts in the app: this machine's
      # own, against musl. The other three need zig or a Mac, and the
      # build says it left them out.
      - name: Install GTK and fontconfig headers, and musl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libfontconfig1-dev musl-tools

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --workspace --all-targets

      - name: Test
        run: cargo test --locked --workspace

      # Every app carries perchd built against musl and linked statically,
      # so a host needs no particular libc. This fails a change that pulls
      # in OpenSSL or something else that will not link that way: the one
      # the build above made for the app is looked at.
      - name: Check the app's perchd is static
        run: |
          bin=target/engines/x86_64-unknown-linux-musl/debug/perchd
          "$bin" --version
          if readelf -lW "$bin" | grep -q INTERP || readelf -dW "$bin" | grep -q NEEDED; then
            echo "::error::perchd is dynamically linked"
            exit 1
          fi
