[package]
name = "perch-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# The handles and helpers perch-app's own tests build windows with: a
# `Backend` with nothing behind it, or one that records what it is sent.
test-support = []

[dependencies]
perch-github = { path = "../perch-github" }
perch-git = { path = "../perch-git" }
perch-syntax = { path = "../perch-syntax" }
perch-lsp = { path = "../perch-lsp" }
perch-agent = { path = "../perch-agent" }
perch-knowledge = { path = "../perch-knowledge" }
semver = "1"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
jiff.workspace = true
toml.workspace = true
# Faces are cut to their circle here, from PNG, JPEG or a GIF's first
# frame.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
# A feedback report has tokens and secrets scrubbed out by pattern.
regex = "1"

[dev-dependencies]
tempfile = "3"
