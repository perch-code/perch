[package]
name = "perch-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "perch"
path = "src/main.rs"

[dependencies]
perch-github = { path = "../perch-github" }
perch-git = { path = "../perch-git" }
perch-syntax = { path = "../perch-syntax" }
perch-lsp = { path = "../perch-lsp" }
perch-agent = { path = "../perch-agent" }
perch-knowledge = { path = "../perch-knowledge" }
pulldown-cmark = { version = "0.13", default-features = false }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
jiff.workspace = true
# vello rather than the default vger renderer. vger's glyph atlas keys on
# (font file, glyph, rounded size, subpixel bin) without the face index or a
# variable font's coordinates, so Regular and Bold from one .ttc collapse
# into a single cached bitmap and whichever drew first wins. That showed up
# as text changing weight mid-word and as bold glyphs drawn on regular
# spacing. vello's cache keys on the blob, the index and the coordinates.
floem = { git = "https://github.com/lapce/floem", branch = "main", default-features = false, features = [
    "vello",
    "editor",
    "serde",
    "default-image-formats",
] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# floem's renderer, for its usvg: an SVG file is parsed into the tree the
# renderer's `draw_svg` takes, so the two are the one crate.
floem_renderer = { git = "https://github.com/lapce/floem", branch = "main" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

[dev-dependencies]
tempfile = "3"
