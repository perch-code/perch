[package]
name = "perch-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "perch"
path = "src/main.rs"

[dependencies]
perch-github = { path = "../perch-github" }
perch-git = { path = "../perch-git" }
perch-syntax = { path = "../perch-syntax" }
perch-lsp = { path = "../perch-lsp" }
perch-agent = { path = "../perch-agent" }
perch-knowledge = { path = "../perch-knowledge" }
pulldown-cmark = { version = "0.13", default-features = false }
semver = "1"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
jiff.workspace = true
toml.workspace = true
# vger, floem's default renderer, named so the choice is on record: vello
# was tried and dropped because it holds 165 MB of GPU scratch buffers sized
# for its benchmark scenes before it draws anything, most of Perch's memory.
# vger's glyph atlas keyed on (font file, glyph, rounded size, subpixel
# bin) without the face index or a variable font's coordinates, so Regular
# and Bold from one .ttc collapsed into a single cached bitmap and
# whichever drew first won, which is what sent Perch to vello; the fork's
# branch folds both into the key.
floem = { git = "https://github.com/lapce/floem", branch = "main", default-features = false, features = [
    "vger",
    "editor",
    "serde",
    "default-image-formats",
] }
# Faces, and the pictures comments show: PNG, JPEG and a GIF's first
# frame here, WebP through floem's default-image-formats.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
# floem's renderer, for its usvg: an SVG file is parsed into the tree the
# renderer's `draw_svg` takes, so the two are the one crate.
floem_renderer = { git = "https://github.com/lapce/floem", branch = "main" }
# parley's font collection, the one floem lays text out with, for
# registering SF Mono's files by hand: see `theme::install_code_font`.
# The version is parley's, and a bump of floem's parley must move it.
fontique = "0.7"
# The find bar's query, plain or as a pattern: both go through one
# matcher, the plain one escaped.
regex = "1"
# GitHub's emoji shortcodes, gemoji's: a composer's `:` lists them, and a
# comment's `:tada:` is drawn as its emoji.
emojis = "0.9"
# TeX math, `$x^2$` and `$$…$$` in a comment, typeset in STIX Two Math
# (bundled) and drawn as an SVG of its glyphs' outlines, where GitHub runs
# MathJax. Pure Rust, on ttf-parser alone.
latex-rust = { version = "2.1", default-features = false, features = ["std"] }
# Mermaid diagrams in a walkthrough, laid out and written as an SVG of
# plain shapes and `<text>`, which usvg draws as it draws any picture.
# Pure Rust, on thiserror alone; its themes take Perch's colours.
mermaid-svg = "0.7"
# How many columns a character takes in the code's font, for word wrap: a
# CJK character or an emoji takes two. Already in the tree through
# codespan-reporting.
unicode-width = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSApplication", "NSEvent", "NSImage", "NSMenu", "NSMenuItem", "NSScroller", "NSControl", "NSResponder", "NSView", "NSWindow", "NSScreen"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSNotification", "NSString", "NSOperation", "NSGeometry", "NSArray", "block2"] }

[dev-dependencies]
tempfile = "3"
